<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频约束测试工具 - 阶段4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #333;
        }
        
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        
        .section {
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 24px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .btn-danger {
            background: #ff6b6b;
            color: white;
        }
        
        .btn-danger:hover {
            background: #ee5a52;
        }
        
        .result-box {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 20px;
            margin-top: 15px;
            font-family: Monaco, Menlo, 'Ubuntu Mono', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.6;
        }
        
        .log-item {
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .log-item:last-child {
            border-bottom: none;
        }
        
        .log-time {
            color: #999;
            margin-right: 8px;
        }
        
        .log-success {
            color: #52c41a;
        }
        
        .log-warning {
            color: #faad14;
        }
        
        .log-error {
            color: #f5222d;
        }
        
        .log-info {
            color: #1890ff;
        }
        
        .meter-box {
            background: white;
            border: 2px solid #ddd;
            border-radius: 6px;
            padding: 20px;
            margin-top: 15px;
        }
        
        .meter-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        
        .meter-bar {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }
        
        .meter-fill {
            height: 100%;
            background: linear-gradient(90deg, #52c41a, #faad14, #ff6b6b);
            width: 0%;
            transition: width 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 11px;
            font-weight: bold;
        }
        
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 8px;
            margin-bottom: 8px;
        }
        
        .badge-success {
            background: #dff0d8;
            color: #3c763d;
        }
        
        .badge-warning {
            background: #fcf8e3;
            color: #8a6d3b;
        }
        
        .badge-error {
            background: #f2dede;
            color: #a94442;
        }
        
        .constraint-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        .constraint-table th,
        .constraint-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
            font-size: 13px;
        }
        
        .constraint-table th {
            background: #f5f5f5;
            font-weight: 600;
            color: #333;
        }
        
        .constraint-table td {
            color: #666;
        }
        
        .constraint-table code {
            background: #f9f9f9;
            padding: 4px 8px;
            border-radius: 3px;
            font-family: Monaco, monospace;
            font-size: 12px;
        }
        
        .video-preview {
            width: 100%;
            max-width: 400px;
            border-radius: 6px;
            background: #000;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 音频约束测试工具</h1>
        <p class="subtitle">验证前端音频处理（阶段4）是否正确应用</p>
        
        <div class="section">
            <div class="section-title">1️⃣ 获取媒体流</div>
            <div class="button-group">
                <button class="btn-primary" onclick="testWithConstraints()">✅ 测试（带约束）</button>
                <button class="btn-secondary" onclick="testWithoutConstraints()">❌ 对比（无约束）</button>
                <button class="btn-danger" onclick="stopMedia()">⏹ 停止流</button>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">约束配置（带约束模式）</div>
            <table class="constraint-table">
                <thead>
                    <tr>
                        <th>参数</th>
                        <th>值</th>
                        <th>说明</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><code>echoCancellation</code></td>
                        <td>✅ <code>true</code></td>
                        <td>回声消除</td>
                    </tr>
                    <tr>
                        <td><code>noiseSuppression</code></td>
                        <td>✅ <code>true</code></td>
                        <td>噪声抑制</td>
                    </tr>
                    <tr>
                        <td><code>autoGainControl</code></td>
                        <td>✅ <code>true</code></td>
                        <td>自动增益控制</td>
                    </tr>
                    <tr>
                        <td><code>channelCount</code></td>
                        <td>✅ <code>1</code></td>
                        <td>单声道</td>
                    </tr>
                    <tr>
                        <td><code>sampleRate</code></td>
                        <td>✅ <code>16000 Hz</code></td>
                        <td>16kHz 采样率</td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div class="section">
            <div class="section-title">📊 音频信息</div>
            <div id="audioInfo" style="font-size: 12px; line-height: 1.8; color: #666;"></div>
            <div class="meter-box">
                <div class="meter-label">实时音量</div>
                <div class="meter-bar">
                    <div class="meter-fill" id="volumeMeter" style="width: 0%;"></div>
                </div>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">📹 视频预览</div>
            <video id="videoPreview" class="video-preview" autoplay muted></video>
        </div>
        
        <div class="section">
            <div class="section-title">📋 日志</div>
            <div class="result-box" id="logBox">
                <div class="log-item">
                    <span class="log-time">[系统]</span>
                    <span class="log-info">等待用户操作...</span>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let mediaStream = null;
        let audioContext = null;
        let analyser = null;
        let dataArray = null;
        let animationId = null;
        
        function log(message, type = 'info') {
            const logBox = document.getElementById('logBox');
            const now = new Date().toLocaleTimeString('zh-cn');
            const logClass = `log-${type}`;
            const symbol = {
                'success': '✅',
                'warning': '⚠️',
                'error': '❌',
                'info': 'ℹ️'
            }[type] || 'ℹ️';
            
            const item = document.createElement('div');
            item.className = 'log-item';
            item.innerHTML = `<span class="log-time">[${now}]</span> <span class="${logClass}">${symbol} ${message}</span>`;
            logBox.appendChild(item);
            logBox.scrollTop = logBox.scrollHeight;
        }
        
        async function testWithConstraints() {
            log('开始请求媒体流（带约束）...', 'info');
            
            const audioConstraints = {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true,
                channelCount: 1,
                sampleRate: { ideal: 16000 }
            };
            
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: audioConstraints
                });
                
                log('✅ 媒体流获取成功', 'success');
                
                // 显示音频轨道信息
                const audioTrack = mediaStream.getAudioTracks()[0];
                if (audioTrack) {
                    const settings = audioTrack.getSettings();
                    log(`音频轨道已获取: ${audioTrack.label}`, 'info');
                    log(`  - sampleRate: ${settings.sampleRate} Hz`, 'info');
                    log(`  - channelCount: ${settings.channelCount}`, 'info');
                    log(`  - echoCancellation: ${settings.echoCancellation}`, 'success');
                    log(`  - noiseSuppression: ${settings.noiseSuppression}`, 'success');
                    log(`  - autoGainControl: ${settings.autoGainControl}`, 'success');
                    
                    // 更新摘要
                    updateAudioInfo(settings);
                }
                
                // 绑定视频
                const videoElement = document.getElementById('videoPreview');
                videoElement.srcObject = mediaStream;
                
                // 启动音量监测
                startAudioAnalysis();
                
                log('🎤 音频处理已启用（回声消除、噪声抑制、自动增益）', 'success');
                log('📢 为获得最佳效果，建议使用耳机！', 'warning');
                
            } catch (error) {
                log(`❌ 获取媒体流失败: ${error.message}`, 'error');
            }
        }
        
        async function testWithoutConstraints() {
            log('开始请求媒体流（无约束，用于对比）...', 'info');
            
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true  // 无约束
                });
                
                log('✅ 媒体流获取成功（无约束）', 'warning');
                log('⚠️ 此模式用于对比测试，可能有回声和噪音', 'warning');
                
                const audioTrack = mediaStream.getAudioTracks()[0];
                if (audioTrack) {
                    const settings = audioTrack.getSettings();
                    log(`音频轨道已获取: ${audioTrack.label}`, 'info');
                    log(`  - sampleRate: ${settings.sampleRate} Hz`, 'info');
                    log(`  - channelCount: ${settings.channelCount}`, 'info');
                    
                    updateAudioInfo(settings);
                }
                
                const videoElement = document.getElementById('videoPreview');
                videoElement.srcObject = mediaStream;
                
                startAudioAnalysis();
                
            } catch (error) {
                log(`❌ 获取媒体流失败: ${error.message}`, 'error');
            }
        }
        
        function updateAudioInfo(settings) {
            const infoDiv = document.getElementById('audioInfo');
            infoDiv.innerHTML = `
                <div style="padding: 12px; background: #f9f9f9; border-radius: 6px;">
                    <div style="margin-bottom: 8px;"><strong>采样率：</strong> ${settings.sampleRate || '?'} Hz</div>
                    <div style="margin-bottom: 8px;"><strong>声道数：</strong> ${settings.channelCount || '?'}</div>
                    <div style="margin-bottom: 8px;"><strong>回声消除：</strong> <span class="status-badge ${settings.echoCancellation ? 'badge-success' : 'badge-error'}">${settings.echoCancellation ? '✅ 启用' : '❌ 禁用'}</span></div>
                    <div style="margin-bottom: 8px;"><strong>噪声抑制：</strong> <span class="status-badge ${settings.noiseSuppression !== false ? 'badge-success' : 'badge-error'}">${settings.noiseSuppression !== false ? '✅ 启用' : '❌ 禁用'}</span></div>
                    <div><strong>自动增益：</strong> <span class="status-badge ${settings.autoGainControl ? 'badge-success' : 'badge-error'}">${settings.autoGainControl ? '✅ 启用' : '❌ 禁用'}</span></div>
                </div>
            `;
        }
        
        function startAudioAnalysis() {
            if (!mediaStream) return;
            
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            const source = audioContext.createMediaStreamSource(mediaStream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            
            const bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
            
            source.connect(analyser);
            
            updateVolumeMeter();
        }
        
        function updateVolumeMeter() {
            if (!analyser || !dataArray) return;
            
            analyser.getByteFrequencyData(dataArray);
            
            // 计算平均值
            const average = dataArray.reduce((a, b) => a + b) / dataArray.length;
            const percentage = Math.min(100, (average / 255) * 100);
            
            const meter = document.getElementById('volumeMeter');
            meter.style.width = percentage + '%';
            meter.textContent = Math.round(percentage) + '%';
            
            animationId = requestAnimationFrame(updateVolumeMeter);
        }
        
        function stopMedia() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
                log('⏹ 媒体流已停止', 'info');
            }
            
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            
            const videoElement = document.getElementById('videoPreview');
            videoElement.srcObject = null;
            
            document.getElementById('volumeMeter').style.width = '0%';
            document.getElementById('audioInfo').innerHTML = '';
        }
        
        // 页面关闭时清理
        window.addEventListener('beforeunload', stopMedia);
    </script>
</body>
</html>
