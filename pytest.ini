[pytest]
# ============================================================================
# 只收集 tests_safe/ 目录。
#
# 为什么必须限制：
#   tests/ 下的旧测试会 `from server import app`，而 server 经 .env 连接
#   生产库（阿里云 RDS）。其中约 38 处为写操作，例如
#   tests/test_llm_endpoints.py 会向 /api/save-transcript 提交伪造记录。
#   裸跑 `pytest` 收集到它们，就等于真实写入生产数据。
#
# 因此这里采用「白名单」而非「黑名单」：新增测试放入 tests_safe/ 才会被执行，
# 旧测试在阶段 1 完成隔离改造前不会被任何命令意外触发。
#
# 隔离分层的落地与回归细节见 tests_safe/README.md、tests_safe/test_legacy_isolation.py。
#
# 临时目录名，阶段 3 结构调整时会与 tests/ 合并为统一布局。
# ============================================================================
testpaths = tests_safe
